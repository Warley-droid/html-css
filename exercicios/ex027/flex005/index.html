<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: lightcoral;
        }

        main{ 
            /* Conteiner */
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;

            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        section{
            /* Itens */
            background-color: white;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>
</html>
